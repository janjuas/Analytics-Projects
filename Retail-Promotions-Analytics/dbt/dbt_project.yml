name: dunnhumby_promo
version: "1.0.0"
config-version: 2
profile: dunnhumby_promo

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Calendar date assigned to study DAY 1 (the source has day numbers only).
  day_one_date: "2018-01-01"

models:
  dunnhumby_promo:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

data_tests:
  dunnhumby_promo:
    +store_failures: false
