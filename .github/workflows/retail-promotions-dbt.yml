name: Retail Promotions - dbt

on:
  pull_request:
    branches: [main]
    paths: ["Retail-Promotions-Analytics/dbt/**", "Retail-Promotions-Analytics/infra/sync_dbt_job.py", ".github/workflows/retail-promotions-dbt.yml"]
  push:
    branches: [main]
    paths: ["Retail-Promotions-Analytics/dbt/**", "Retail-Promotions-Analytics/infra/sync_dbt_job.py"]
  workflow_dispatch:
    inputs:
      env:
        description: Fabric environment to publish to and run
        type: choice
        options: [dev, prod]
        default: dev
      operation:
        description: dbt command for the Fabric dbt job
        type: choice
        options: [build, run, test, compile]
        default: build

jobs:
  # Every PR: no credentials needed. Catches broken refs, YAML and Jinja before review.
  parse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Retail-Promotions-Analytics/dbt
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Retail-Promotions-Analytics/requirements.txt
      - run: pip install -r ../requirements.txt
      - run: dbt deps
      - run: dbt parse

  # Merge to main (or manual): publish dbt/ to the Lakehouse folder the Fabric dbt job reads from,
  # then run the job in Fabric and fail this workflow if any model or test fails.
  # Needs the service-principal secrets and FABRIC_CI_ENABLED=true (see README > CI secrets).
  fabric-dbt-job:
    needs: parse
    if: ${{ github.event_name != 'pull_request' && vars.FABRIC_CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'prod' && 'production' || 'development' }}
    concurrency: fabric-dbt-${{ inputs.env || 'dev' }}
    defaults:
      run:
        working-directory: Retail-Promotions-Analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Retail-Promotions-Analytics/requirements.txt
      - run: pip install -r requirements.txt
      - name: dbt deps (vendored into the upload)
        working-directory: Retail-Promotions-Analytics/dbt
        run: dbt deps
      - uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"00000000-0000-0000-0000-000000000000"}
          allow-no-subscriptions: true
      - name: Publish project and run Fabric dbt job
        run: >-
          python infra/sync_dbt_job.py --run
          --env ${{ inputs.env || 'dev' }}
          --operation ${{ inputs.operation || 'build' }}
